name: Service Docker Image Build & Push

on:
  push:
    branches:
      - dev
  workflow_dispatch: # 添加手动触发
  # release:
  #   types: [published]

env:
  DOCKER_USER: ${{ github.repository_owner }}
  IMAGE_NAME: miderproduce-service
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ============================================
  # Job 1: 版本信息提取
  # ============================================
  extract-version:
    name: 📋 Extract Project Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      docker-tag: ${{ steps.get-version.outputs.docker-tag }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔍 Parse Version from build.gradle.kts
        id: get-version
        run: |
          VERSION=$(sed -n '/allprojects/,/}/p' build.gradle.kts | grep -E '^\s*version\s*=\s*".*"' | sed -E 's/.*"(.+)".*/\1/')
          
          if [ -z "$VERSION" ]; then
            echo "❌ Failed to extract version from build.gradle.kts"
            exit 1
          fi
        
          DOCKER_TAG="${VERSION}"
          
          echo "📦 Detected Project Version: $VERSION"
          echo "🏷️  Docker Tag: $DOCKER_TAG"
          
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "docker-tag=$DOCKER_TAG" >> $GITHUB_OUTPUT

  # ============================================
  # Job 2: Gradle 构建 Fat Jar
  # ============================================
  build-jar:
    name: 🔨 Build Fat Jar with Gradle
    runs-on: ubuntu-latest
    needs: extract-version

    steps:
      - name: 📥 Checkout Repository with Submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: ☕ Setup Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: 'gradle'

      - name: 🔧 Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: 🏗️ Build Fat Jar (Skip Tests)
        env:
          GITHUB_USER: ${{ secrets.GITHUB_USER }}
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}
        run: |
          echo "🚀 Starting Gradle build for service module..."
          ./gradlew :service:buildFatJar -x test --no-daemon --stacktrace
          echo "✅ Gradle build completed successfully"

      - name: ✔️ Verify Fat Jar Exists
        run: |
          JAR_PATH="service/build/libs/service-all.jar"
          if [ ! -f "$JAR_PATH" ]; then
            echo "❌ Fat Jar not found at: $JAR_PATH"
            exit 1
          fi
          
          JAR_SIZE=$(du -h "$JAR_PATH" | cut -f1)
          echo "✅ Fat Jar found: $JAR_PATH (Size: $JAR_SIZE)"

      - name: 📤 Upload Fat Jar as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: service-fat-jar
          path: service/build/libs/service-all.jar
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # Job 3: 准备 Docker 构建上下文
  # ============================================
  prepare-docker-context:
    name: 📦 Prepare Docker Build Context
    runs-on: ubuntu-latest
    needs: build-jar

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📥 Download Fat Jar Artifact
        uses: actions/download-artifact@v4
        with:
          name: service-fat-jar
          path: ./artifacts

      - name: 📋 Copy Files to Build Context
        run: |
          echo "📂 Preparing Docker build context..."
          
          # 复制 Fat Jar
          cp ./artifacts/service-all.jar ./service.jar
          echo "✅ Copied service.jar ($(du -h ./service.jar | cut -f1))"
          
          # 复制 Dockerfile
          cp ./service/src/Dockerfile ./Dockerfile
          echo "✅ Copied Dockerfile"
          
          # 复制配置文件
          if [ -f "./service/src/main/resources/application.conf.default" ]; then
            cp ./service/src/main/resources/application.conf.default ./application.conf.default
            echo "✅ Copied application.conf.default"
          else
            echo "⚠️  application.conf.default not found, skipping..."
          fi
          
          echo "📦 Build context prepared successfully"

      - name: 📤 Upload Docker Context as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-build-context
          path: |
            service.jar
            Dockerfile
            application.conf.default
          retention-days: 1
          if-no-files-found: error

  # ============================================
  # Job 4: 构建并推送 Docker 镜像
  # ============================================
  build-and-push-docker:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [extract-version, prepare-docker-context]
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Download Docker Build Context
        uses: actions/download-artifact@v4
        with:
          name: docker-build-context
          path: .

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.extract-version.outputs.docker-tag }}
            type=raw,value=latest,enable=${{ github.ref_name == 'dev' }}

      - name: 🐳 Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ needs.extract-version.outputs.version }}

      - name: 📊 Output Image Information
        run: |
          echo "🎉 Docker image build and push completed!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Repository: ${{ env.DOCKER_USER }}/${{ env.IMAGE_NAME }}"
          echo "🏷️  Tags pushed:"
          echo "${{ steps.meta.outputs.tags }}" | sed 's/^/    - /'
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  # ============================================
  # Job 5: 构建总结（可选）
  # ============================================
  build-summary:
    name: 📝 Build Summary
    runs-on: ubuntu-latest
    needs: [extract-version, build-jar, prepare-docker-context, build-and-push-docker]
    if: always()

    steps:
      - name: 📊 Generate Build Summary
        run: |
          echo "# 🚀 Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Project Version | \`${{ needs.extract-version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏷️ Docker Tag | \`${{ needs